name: Build APK

# Builds a release APK every time commits land on main
# (a merged pull request, or a direct push), and on demand from the Actions tab.
on:
  push:
    # The feature branch is listed so changes can be test-built before they are merged
    branches: [main, claude/charming-franklin-2f7vlv]
    paths-ignore:
      - "**.md"
      - "promotional/**"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter version used to build. pubspec.lock needs Flutter >= 3.19 / Dart >= 3.3
  # and android/ uses AGP 7.3.1 + Gradle 7.5, so stay on a release from that era.
  FLUTTER_VERSION: "3.24.5"
  JAVA_VERSION: "17"
  # versionCode is pubspec build number (416 at time of writing). Offset the CI run
  # number so every CI build has a higher versionCode and installs over the previous one.
  BUILD_NUMBER_OFFSET: 1000

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: budget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # android/app/build.gradle reads android/key.properties for the release signing config.
      # Add these repository secrets (Settings > Secrets and variables > Actions) to sign with
      # your own key so each new APK can be installed over the previous one:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Run `bash scripts/make-android-keystore.sh` once on your own machine: it creates the key
      # and prints the 4 values. Never commit the keystore: this repository is public.
      # Without them a throwaway key is generated: the APK still installs, but because the key
      # changes every build, Android will ask you to uninstall the previous build first.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "SIGNING_NOTE=Signed with the key from repository secrets." >> "$GITHUB_ENV"
          else
            STORE_PASSWORD="ci-temporary-key"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="ci"
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks -storetype JKS \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Cashew CI, O=CI, C=VN" > /dev/null 2>&1
            echo "SIGNING_NOTE=No signing secrets set: signed with a throwaway key. Add the ANDROID_* secrets to keep a stable signature." >> "$GITHUB_ENV"
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          NAME="cashew-${VERSION}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/${NAME}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "- File: \`${NAME}\` (download it from *Artifacts* below)" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${SIGNING_NOTE}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: budget/build/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
